[files]
# Check dotfiles, such as .github/.
ignore-hidden = false
extend-exclude = [
  ".git/",
  "mise.lock",
  "package-lock.json",
  # Generated; fix the source instead.
  "**/generated/",
  "spec/openapi.yaml",
  # Third-party; hashes are recorded in skills-lock.json.
  ".claude/skills/",
  # Must not be edited.
  ".github/workflows/hexlet-check.yml",
]
